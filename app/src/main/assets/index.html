<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Productivity Tracker</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#e8739b"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf6f9;--card:#fff;--tx:#3a2e36;--mu:#8a7a84;--pk:#e8739b;--ok:#23824f;--okb:#d3f0df;--no:#c93a52;--nob:#fbd5da;--ln:#f0dfe6;--me:#efe4fa;--tb:93%;--ta:38%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d171b;--card:#2a2227;--tx:#f3e8ee;--mu:#b3a2ac;--pk:#f08db0;--ok:#6fdc9b;--okb:#1f4a33;--no:#ff8a9c;--nob:#5a2630;--ln:#3d3239;--me:#3a2f4a;--tb:24%;--ta:72%}}
:root[data-theme="dark"]{--bg:#1d171b;--card:#2a2227;--tx:#f3e8ee;--mu:#b3a2ac;--pk:#f08db0;--ok:#6fdc9b;--okb:#1f4a33;--no:#ff8a9c;--nob:#5a2630;--ln:#3d3239;--me:#3a2f4a;--tb:24%;--ta:72%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{text-align:center;padding:14px 12px 6px}h1{margin:0;font-size:1.25rem;color:var(--pk)}header p{margin:2px 0 8px;color:var(--mu);font-size:.8rem}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
nav button.on,.btn.on{background:var(--pk);color:#fff;border-color:var(--pk)}
main{max-width:980px;margin:0 auto;padding:10px 12px 40px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:12px}
h2{font-size:1rem;margin:0 0 8px;color:var(--pk)}
.c{width:40px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--mu);font:700 16px system-ui;cursor:pointer;padding:0}
.c.s1{background:var(--okb);color:var(--ok);border-color:var(--ok)}.c.s2{background:var(--nob);color:var(--no);border-color:var(--no)}
.me{background:var(--me);border-radius:12px;padding:14px;text-align:center}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--pk)}
.sc{overflow:auto;max-height:68vh;border:1px solid var(--ln);border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.82rem}
th,td{padding:5px 6px;border-bottom:1px solid var(--ln);text-align:center;background:var(--card)}
th{position:sticky;top:0;z-index:2;font-size:.68rem;color:var(--mu);min-width:62px;font-weight:600}
td:first-child,th:first-child{position:sticky;left:0;z-index:1;text-align:left;min-width:92px;border-right:1px solid var(--ln)}
th:first-child{z-index:3}
td.me{background:var(--me)}
.sum{display:flex;gap:10px;flex-wrap:wrap}.sum div{flex:1;min-width:90px;text-align:center;border-radius:12px;padding:10px;background:var(--bg)}.sum b{display:block;font-size:1.4rem}
.l{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.tbl td,.tbl th{position:static;min-width:0;text-align:left;font-size:.82rem;color:var(--tx)}.tbl th{color:var(--mu)}
.tag{font-size:.7rem;background:var(--me);border-radius:10px;padding:2px 8px}
.go{cursor:pointer}small{color:var(--mu)}
body{background:radial-gradient(circle at 10% 0,#ffd6e8 0,transparent 35%),radial-gradient(circle at 100% 20%,#d9e8ff 0,transparent 30%),var(--bg);background-attachment:fixed}
header{background:linear-gradient(135deg,#ff8fb8,#b78cff 55%,#6cc8ff);border-radius:0 0 28px 28px;box-shadow:0 6px 18px #b78cff55;padding-bottom:14px}
header h1{color:#fff;font-size:1.45rem;text-shadow:0 2px 6px #0003}header p{color:#fffe}
nav button{background:#ffffff38;color:#fff;border-color:#fff7;font-weight:600}nav button.on{background:#fff;color:#c2477a;border-color:#fff}
.card{border-top:4px solid var(--pk);box-shadow:0 4px 14px #e8739b1f}
.tg{display:grid;gap:10px}
.tk{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:20px;cursor:pointer;background:linear-gradient(120deg,hsl(var(--h) 85% var(--tb)),var(--card));border:2px solid hsl(var(--h) 70% 70%/.7);box-shadow:0 4px 12px hsl(var(--h) 70% 50%/.18);transition:transform .15s;user-select:none}
.tk:active{transform:scale(.97)}
.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:hsl(var(--h) 90% 60%/.28);flex:none}
.tx{flex:1;display:flex;flex-direction:column}.tx b{font-size:1rem}.tx small{color:hsl(var(--h) 60% var(--ta));font-weight:700}
.st{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 20px system-ui;background:var(--card);color:var(--mu);border:2px dashed var(--mu);flex:none}
.tk.s1{background:linear-gradient(120deg,var(--okb),var(--card));border-color:var(--ok)}.tk.s1 .st{background:var(--ok);color:#fff;border:0}.tk.s1 .tx b{text-decoration:line-through;opacity:.7}
.tk.s2{background:linear-gradient(120deg,var(--nob),var(--card));border-color:var(--no)}.tk.s2 .st{background:var(--no);color:#fff;border:0}
.ring{width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--pk) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center;position:relative;flex:none}.ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}.ring b{position:relative;font-size:1.1rem}
.rw{display:flex;align-items:center;gap:14px;margin-top:10px;font-weight:600}
td.ch,th.ch{background:hsl(var(--h) 85% var(--tb));color:var(--tx)}th.ch{font-size:.66rem}
.sum div:nth-child(1){background:linear-gradient(135deg,#ffd0e2,#e6d3ff)}.sum div:nth-child(2){background:var(--okb)}.sum div:nth-child(3){background:var(--nob)}.sum div:nth-child(4){background:var(--me)}
.sum div{color:#3a2e36}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sum div{color:#f3e8ee}}

body.hol{background:radial-gradient(circle at 12% 0,#ffe08a 0,transparent 40%),radial-gradient(circle at 92% 18%,#ff9ec4 0,transparent 36%),linear-gradient(180deg,#fff4d6,#ffe6f0);background-attachment:fixed}
body.hol header{background:linear-gradient(135deg,#ff9a3c,#ff5e8a 55%,#b04cff);box-shadow:0 6px 18px #ff5e8a66}
body.hol header h1::after{content:" 🎊"}
body.hol .card{border-top-color:#ff9a3c;box-shadow:0 4px 16px #ff9a3c33}
body.hol .me{background:linear-gradient(135deg,#ffe3a3,#ffc2dc);border:2px dashed #ff9a3c;padding:26px 14px;color:#5a2a1a;font-weight:600}
body.hol .me small{color:#8a4a2a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body.hol{background:radial-gradient(circle at 12% 0,#5a3a10 0,transparent 40%),radial-gradient(circle at 92% 18%,#55203f 0,transparent 36%),#1d1417}:root:not([data-theme="light"]) body.hol .me{background:linear-gradient(135deg,#5a4216,#5a2a45);color:#fff0e0}:root:not([data-theme="light"]) body.hol .me small{color:#f5cfa8}}

body.sun{background:radial-gradient(circle at 90% 0,#ffe9a8 0,transparent 35%),radial-gradient(circle at 5% 25%,#bff3ea 0,transparent 38%),linear-gradient(180deg,#dff4ff,#ffeede 65%,#ffe0f0);background-attachment:fixed}
body.sun header{background:linear-gradient(135deg,#2fd0bd,#5ab8ff 55%,#b78cff);box-shadow:0 6px 18px #5ab8ff66}
body.sun header h1::after{content:" 🌴"}
body.sun .card{border-top-color:#2fd0bd;box-shadow:0 4px 16px #5ab8ff33}
body.sun .me{background:linear-gradient(160deg,#c9f3ff,#fff1d6 60%,#ffd3e8);border:2px dashed #2fd0bd;padding:18px 12px;color:#14466a;font-weight:600}
body.sun .me small{color:#35688a}
.sunt{font-size:1.25rem;font-weight:800;margin:2px 0}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.ct{border-radius:18px;padding:12px 6px;background:hsl(var(--h) 85% 90%);border:2px solid hsl(var(--h) 70% 65%/.7);color:#3a2e36;font-weight:700;font-size:.85rem;box-shadow:0 3px 8px hsl(var(--h) 70% 50%/.2)}
.ct span{display:block;font-size:2.2rem;margin-bottom:2px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body.sun{background:radial-gradient(circle at 90% 0,#4a4018 0,transparent 35%),radial-gradient(circle at 5% 25%,#12403d 0,transparent 38%),#14181d}:root:not([data-theme="light"]) body.sun .me{background:linear-gradient(160deg,#143a4a,#3a3320 60%,#4a2540);color:#e8f6ff}:root:not([data-theme="light"]) body.sun .me small{color:#a9d3ea}}
</style></head><body>
<header><h1>♡ My Productivity Tracker ♡</h1><p>October 2026 – April 2027 · Sundays &amp; Holidays = Me Time</p><nav id="nav"></nav></header>
<main id="m"></main>
<script>
const T=[["5:00–6:30","Wake up + Morning walk"],["6:30–7:30","Getting ready"],["7:30–8:00","Breakfast"],["8:00–8:30","Pack bag"],["8:30–9:00","Travel to office"],["9:00–7:30","Office"],["7:30–8:00","Travel home"],["8:00–9:00","Refresh + Dinner"],["9:00–9:30","Drawing / Painting"],["9:30–10:00","Blog Topics"],["10:00–10:30","Read News"],["10:30–11:00","Read Book"],["11:00–5:00","Sleep"]];
const H={"2026-10-02":"Gandhi Jayanti","2026-10-19":"Ayutha Pooja","2026-11-09":"Deepavali 2nd Day","2026-12-25":"Christmas","2027-01-01":"New Year's Day","2027-01-15":"Pongal / Thiruvalluvar Day","2027-01-16":"Uzhavar Thirunal","2027-01-23":"Thaipoosam","2027-01-26":"Republic Day","2027-03-10":"Ramzan / Idul Fitr","2027-03-26":"Good Friday","2027-04-08":"Telugu New Year","2027-04-14":"Tamil New Year / Dr. B.R. Ambedkar Jayanti","2027-04-19":"Mahavir Jayanti"};
const E=["🌅","🪞","🍳","🎒","🚌","💼","🏠","🍜","🎨","✍️","📰","📖","🌙"],HU=[28,320,45,200,165,225,150,10,280,340,55,250,260];
const SK=["Operations Fundamentals","Process Flow","Process Performance","Lean Operations","Problem Solving","Operations Application","Inventory Fundamentals","Inventory Control","Inventory KPIs","BOM & Material Planning","MRP","Kitting & Material Readiness","Supply Chain Management","Procurement"];
const TL=[["8:00–2:00","Section 1 · Learn","🎓",210,"Concepts + examples"],["2:00–3:00","Lunch Break · 1 hr","🍽",45,"Recharge"],["3:00–5:00","Section 2 · Apply","🛠",150,"Map / calculate / practice"],["5:00–6:00","Snack Break · 1 hr","🍪",20,"Recharge"],["6:00–8:00","Section 3 · Review","📝",330,"Summary + 1-page output"]];
const HI=[0,1,2,7,8,9,10,11,12,13,14,15],hc=(k,v)=>HI.filter(i=>g(k,i)==v).length;
const row=(k,i,hue,ic,b,sm)=>`<div class="tk s${g(k,i)}" style="--h:${hue}" data-k="${k}" data-i="${i}"><span class="ic">${ic}</span><span class="tx"><b>${b}</b><small>${sm}</small></span><span class="st">${SYM[g(k,i)]}</span></div>`;
const hn=k=>Object.keys(H).indexOf(k)+1;
const tl=()=>`<div class="tg">${TL.map(x=>`<div class="tk" style="--h:${x[3]};cursor:default"><span class="ic">${x[2]}</span><span class="tx"><b>${x[1]}</b><small>${x[0]} · ${x[4]}</small></span></div>`).join("")}</div>`;
const SYM="☐✓✗",Z="0".repeat(16),N=13;
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const typ=d=>(d.getDay()==0||H[iso(d)])?"off":"reg";
const D=[];for(let d=new Date(2026,9,1);d<=new Date(2027,3,30);d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))D.push(d);
const mIdx=d=>(d.getFullYear()-2026)*12+d.getMonth()-9;
const mName=i=>new Date(2026,9+i,1).toLocaleString("en",{month:"long",year:"numeric"});
const dName=(d,o)=>d.toLocaleString("en",o);
let S={};try{S=JSON.parse(localStorage.getItem("pt")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("pt",JSON.stringify(S))}catch(e){}};
const g=(k,i)=>((S[k]||"")+Z)[i];
const cyc=(k,i)=>{const a=((S[k]||"")+Z).slice(0,16).split("");a[i]=(+a[i]+1)%3;S[k]=a.join("");save()};
const cnt=(k,v)=>{let n=0;for(let i=0;i<N;i++)if(g(k,i)==v)n++;return n};
const pct=(a,b)=>b?Math.round(100*a/b)+"%":"0%";
const cell=(k,i)=>`<button class="c s${g(k,i)}" data-k="${k}" data-i="${i}">${SYM[g(k,i)]}</button>`;
const CH=[["🏖️","Beach & sun",190],["🎧","Fav music",280],["🍿","Movie time",20],["🎮","Play games",150],["🧘","Slow stretch",120],["☕","Cozy cafe",30],["🌳","Park walk",100],["📸","Photo walk",330],["🍦","Ice cream",340],["🛋️","Nap & relax",250]];
const sunCard=d=>{const w=Math.floor((d-D[0])/6048e5);return `<div class="me">${SCENE}<div class="sunt">☀️ SUNDAY FUNDAY ☀️</div>ME TIME • REST • RECHARGE • DO WHAT YOU LOVE<div class="cg">${[0,1,2,3,4,5].map(i=>{const c=CH[(w*4+i)%CH.length];return `<div class="ct" style="--h:${c[2]}"><span>${c[0]}</span>${c[1]}</div>`}).join("")}</div><br><small>See the Sunday Plan tab for the learning plan</small></div>`};
const SCENE=`<svg viewBox="0 0 300 90" style="width:100%;max-width:420px;height:auto" aria-hidden="true"><circle cx="235" cy="30" r="17" fill="#ffc933"/><path d="M0 70q25-12 50 0t50 0 50 0 50 0 50 0 50 0v20H0z" fill="#4cc9e8"/><path d="M0 78q25-10 50 0t50 0 50 0 50 0 50 0 50 0v12H0z" fill="#2fb0d6"/><path d="M60 72q4-30-6-46" stroke="#8a5a2b" stroke-width="5" fill="none" stroke-linecap="round"/><g fill="#3bb36b"><ellipse cx="40" cy="26" rx="20" ry="6" transform="rotate(-25 40 26)"/><ellipse cx="68" cy="22" rx="20" ry="6" transform="rotate(25 68 22)"/><ellipse cx="54" cy="18" rx="16" ry="5" transform="rotate(-80 54 18)"/></g><text x="110" y="52" font-size="26">⛱️</text><text x="160" y="58" font-size="22">🐚</text></svg>`;
const banner=k=>H[k]?`<div style="font-size:2.4rem">🎉🪔🎊</div><div style="font-size:1.35rem;font-weight:800;margin:4px 0 8px">${H[k]}</div>`:"";
let d0=new Date();if(d0<D[0])d0=D[0];if(d0>D[D.length-1])d0=D[D.length-1];
let hv=null,tab="today",cur=iso(d0),mi=mIdx(d0);
const byIso=k=>D.find(d=>iso(d)==k);

function stats(){const t=T.map(()=>({d:0,m:0,p:0})),mo=Array.from({length:7},()=>({r:0,d:0,m:0}));
for(const d of D){const k=iso(d);if(typ(d)!="reg")continue;const o=mo[mIdx(d)];o.r++;T.forEach((_,i)=>{const v=g(k,i);t[i].p++;o.d+=v==1;o.m+=v==2;t[i].d+=v==1;t[i].m+=v==2})}
return{t,mo}}

function holDay(d,k){const n=HI.length,dn=hc(k,1),pc=Math.round(100*dn/n);
let h=`<div class="card"><div class="l"><button class="btn" data-tab="holidays">‹ Holidays</button><div style="text-align:center"><b>${dName(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b><br><span class="tag">🎉 ${H[k]}</span> <span class="tag">🎓 Topic ${hn(k)} · ${SK[hn(k)-1]}</span></div><button class="btn" data-nav="1">Next ›</button></div>`;
h+=`<div class="l"><small>${dn}/${n} done · ${hc(k,2)} missed</small><span><button class="btn" data-all="1">All ✓</button> <button class="btn" data-all="0">Reset</button></span></div><div class="rw"><div class="ring" style="--p:${pc}"><b>${pc}%</b></div><div>${dn==n?"🎉 Perfect day, superstar!":dn?"Keep going, you're glowing 💪":"A fresh holiday — let's learn ✨"}</div></div></div><div class="tg">`;
let m=0;T.forEach((x,j)=>{if(j==3||j==5||j==6)return;
if(j==4){h+=`<div class="tk" style="--h:280;cursor:default"><span class="ic">🎓</span><span class="tx"><b>Skill Time · Topic ${hn(k)}</b><small>8:00–8:00 · ${SK[hn(k)-1]}</small></span></div>`+TL.map((t,q)=>q%2?`<div class="tk" style="--h:${t[3]};cursor:default"><span class="ic">${t[2]}</span><span class="tx"><b>${t[1]}</b><small>${t[0]}</small></span></div>`:row(k,13+m++,t[3],t[2],t[1],t[0]+" · "+t[4])).join("");return}
h+=row(k,j,HU[j],E[j],x[1],x[0])});
return h+"</div>"}
const V={
today(){const d=byIso(cur),k=cur,ty=typ(d);
let h=`<div class="card"><div class="l"><button class="btn" data-nav="-1">‹ Prev</button><div style="text-align:center"><b>${dName(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b>${H[k]?`<br><span class="tag">🎉 ${H[k]}</span>`:""}</div><button class="btn" data-nav="1">Next ›</button></div>`;
if(ty=="off"){if(H[k]&&hv==k)return holDay(d,k);if(d.getDay()==0&&!H[k])return h+sunCard(d)+"</div>";return h+`<div class="me">${banner(k)}♡ ${d.getDay()==0?"Sunday":"Holiday"} — ME TIME • REST • RECHARGE • DO WHAT YOU LOVE ♡<br><small>${H[k]?"Open this holiday from the Holidays tab for the skill-learning day":"See the Sunday Plan tab for the learning plan"}</small></div></div>`}
const dn=cnt(k,1);
h+=`<div class="l"><small>${dn}/${N} done · ${cnt(k,2)} missed</small><span><button class="btn" data-all="1">All ✓</button> <button class="btn" data-all="0">Reset</button></span></div><div class="rw"><div class="ring" style="--p:${Math.round(100*dn/N)}"><b>${Math.round(100*dn/N)}%</b></div><div>${dn==N?"🎉 Perfect day, superstar!":dn?"Keep going, you're glowing 💪":"A fresh day — let's begin ✨"}</div></div></div><div class="tg">`;
T.forEach((x,j)=>{h+=`<div class="tk s${g(k,j)}" style="--h:${HU[j]}" data-k="${k}" data-i="${j}"><span class="ic">${E[j]}</span><span class="tx"><b>${x[1]}</b><small>${x[0]}</small></span><span class="st">${SYM[g(k,j)]}</span></div>`});
return h+"</div>"},
month(){let h=`<div class="card"><div class="l" style="flex-wrap:wrap">`;for(let i=0;i<7;i++)h+=`<button class="btn ${i==mi?"on":""}" data-mi="${i}">${mName(i).slice(0,3)} ${mName(i).slice(-2)}</button>`;
h+=`</div><small>Tap a box: ☐ → ✓ done → ✗ missed → ☐</small></div><div class="sc"><table><tr><th>Date</th>${T.map((x,j)=>`<th class="ch" style="--h:${HU[j]}">${E[j]}<br>${x[0]}<br>${x[1]}</th>`).join("")}<th>Done</th></tr>`;
for(const d of D.filter(d=>mIdx(d)==mi)){const k=iso(d),ty=typ(d),lb=dName(d,{day:"2-digit",month:"short"})+" "+dName(d,{weekday:"short"});
if(ty=="off"){h+=`<tr><td class="me">${lb}</td><td class="me" colspan="${N+1}">${H[k]?`🎉 ${H[k]} · ♡ ME TIME • REST • RECHARGE ♡`:"🏖️ SUNDAY FUNDAY · 🎧 CHILL · 🍿 RELAX · 🌴"}</td></tr>`;continue}
h+=`<tr><td class="go" data-go="${k}">${lb}</td>`;
T.forEach((_,j)=>{h+=`<td class="ch" style="--h:${HU[j]}">${cell(k,j)}</td>`});
h+=`<td><b>${cnt(k,1)}</b>/${N}</td></tr>`}
return h+"</table></div>"},
summary(){const s=stats(),P=s.t.reduce((a,x)=>a+x.p,0),Dn=s.t.reduce((a,x)=>a+x.d,0),M=s.t.reduce((a,x)=>a+x.m,0);
let h=`<div class="card"><h2>7-Month Overall Progress</h2><div class="sum"><div><b>${pct(Dn,P)}</b>Completion</div><div><b style="color:var(--ok)">${Dn}</b>Done ✓</div><div><b style="color:var(--no)">${M}</b>Missed ✗</div><div><b>${P-Dn-M}</b>Pending</div></div></div>`;
h+=`<div class="card"><h2>Task Progress</h2><table class="tbl"><tr><th>Task</th><th>✓</th><th>✗</th><th>Possible</th><th>%</th><th></th></tr>`;
